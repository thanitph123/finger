<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแบบสอบถามพฤติกรรมการใช้ AI แบบไร้สัมผัส (6 ข้อ)</title>
    
    <!-- โหลด MediaPipe และไลบรารีควบคุมกล้องผ่าน CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3436;
        }

        /* กล่องหลักโครงสร้างแอป */
        .app-container {
            display: flex;
            flex-direction: column; /* แบ่งเป็น 3 ส่วนในแนวนอน (บน กลาง ล่าง) */
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 850px;
            overflow: hidden;
        }

        /* --------------------------------------------------
           [ส่วนที่ 1] ส่วนของแสดงผลของกล้อง (บนสุด)
        -------------------------------------------------- */
        .part-1-camera {
            width: 100%;
            height: 350px;
            position: relative;
            background-color: #2d3436;
        }
        #webcam, #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror ภาพให้ขยับตามมือได้เป็นธรรมชาติ */
        }

        /* --------------------------------------------------
           [ส่วนที่ 2] ส่วนแสดงข้อความแจ้งเตือน / สถานะมือ (ตรงกลาง)
        -------------------------------------------------- */
        .part-2-message {
            width: 100%;
            padding: 15px 20px;
            background-color: #ffeaa7; /* แถบสีเหลือง */
            border-bottom: 2px solid #fab1a0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        #status-message {
            color: #2d3436;
        }
        .detected-badge {
            background: white;
            padding: 6px 15px;
            border-radius: 20px;
            color: #d63031;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* --------------------------------------------------
           [ส่วนที่ 3] ส่วนแสดงโจทย์และคำถาม (ล่างสุด)
        -------------------------------------------------- */
        .part-3-question {
            width: 100%;
            padding: 30px;
            background-color: #ffffff;
            min-height: 320px; /* เพิ่มพื้นที่ความสูงเพื่อรองรับคำถามที่ยาวขึ้น */
        }
        h2 {
            font-size: 1.4rem;
            color: #0984e3;
            margin-top: 0;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .options-list {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #636e72;
            margin-bottom: 20px;
        }
        .instruction-box {
            font-weight: bold;
            color: #2d3436;
            background-color: #e3faf2;
            padding: 10px 15px;
            border-radius: 8px;
            display: inline-block;
            border-left: 5px solid #2ecc71;
            width: 100%;
        }

        /* หน้าจอบังเวลาเปลี่ยนภาพชั่วคราวเพื่อความเสถียร */
        .cooldown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #0984e3;
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ส่วนที่ 1: กล้องเว็บแคม -->
        <div class="part-1-camera">
            <div class="cooldown-overlay" id="cooldown-screen">🔄 บันทึกข้อมูลคำตอบ... กำลังไปข้อถัดไป</div>
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas" width="850" height="350"></canvas>
        </div>

        <!-- ส่วนที่ 2: ข้อความแจ้งเตือนและสถานะมือ -->
        <div class="part-2-message">
            <div id="status-message">กำลังตรวจสอบระบบตรวจจับสิทธิ์กล้อง AI...</div>
            <div class="detected-badge" id="live-gesture-box" style="display:none;">
                มือตอนนี้: <span id="current-gesture">-</span>
            </div>
        </div>

        <!-- ส่วนที่ 3: โจทย์คำถามและตัวเลือก -->
        <div class="part-3-question">
            <div id="main-text">
                <h2>ระบบกำลังเตรียมความพร้อมคำถาม...</h2>
            </div>
        </div>

    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const statusMessage = document.getElementById('status-message');
        const mainText = document.getElementById('main-text');
        const liveGestureBox = document.getElementById('live-gesture-box');
        const currentGestureText = document.getElementById('current-gesture');
        const cooldownScreen = document.getElementById('cooldown-screen');

        // คลังคำถาม 6 ข้อตามกำหนด
        const questionsDatabase = [
            {
                title: "ข้อ 1: ในช่วง 1 สัปดาห์ที่ผ่านมา คุณเรียกใช้งาน AI (เช่น Gemini, ChatGPT, Claude ฯลฯ) บ่อยแค่ไหน?",
                options: [
                    "แทบไม่ได้ใช้เลย หรือไม่ได้ใช้เลย",
                    "1-3 วันต่อสัปดาห์ (ใช้เฉพาะกิจ)",
                    "ใช้เกือบทุกวัน (วันละ 1-2 ครั้ง)",
                    "ใช้หลายครั้งในแต่ละวัน (เปิดทิ้งไว้เป็นผู้ช่วยประจำตัว)"
                ]
            },
            {
                title: "ข้อ 2: เมื่อคุณต้องเริ่มต้นโปรเจกต์ใหม่ คิดงาน หรือแก้ปัญหาที่ซับซ้อน สิ่งแรกที่คุณมักจะทำคืออะไร?",
                options: [
                    "นั่งคิดและร่างโครงสร้างด้วยตัวเองก่อน",
                    "ค้นหาข้อมูลทั่วไป หรือปรึกษาคนรอบข้าง",
                    "พิมพ์ถาม AI ให้ช่วยโยนไอเดียหรือร่างโครงสร้างให้ทันที",
                    "ให้ AI ทำให้ทั้งหมดแล้วค่อยนำมาเลือก"
                ]
            },
            {
                title: "ข้อ 3: เมื่อ AI ให้คำตอบที่ดูเหมือนจะถูกต้องและเป็นระเบียบเรียบร้อย คุณมักจะจัดการกับข้อมูลนั้นอย่างไร?",
                options: [
                    "ตรวจสอบความถูกต้องกับแหล่งข้อมูลอื่นที่เชื่อถือได้เสมอ",
                    "อ่านทบทวนและปรับแก้สำนวนด้วยตัวเองก่อนนำไปใช้",
                    "ก๊อปปี้ไปใช้งานทันที เพราะเชื่อมั่นว่า AI ประมวลผลมาดีแล้ว"
                ]
            },
            {
                title: "ข้อ 4: ลองสำรวจตัวเองอย่างซื่อสัตย์ คุณรู้สึกว่าความมั่นใจในการ 'ตัดสินใจ' หรือ 'คิดวิเคราะห์' ด้วยตัวเอง ลดลงบ้างหรือไม่ตั้งแต่มี AI เข้ามาช่วย?",
                options: [
                    "ไม่เลย ฉันยังมั่นใจในการคิดและตัดสินใจด้วยตัวเอง 100%",
                    "มีบ้างบางครั้งที่อยากให้ AI ช่วยคอนเฟิร์มความคิด",
                    "ลดลงพอสมควร เริ่มรู้สึกลังเลถ้าไม่ได้ถาม AI ก่อน",
                    "ลดลงมาก แทบไม่กล้าฟันธงอะไรเลยถ้าไม่ได้เอาไปถาม AI"
                ]
            },
            {
                title: "ข้อ 5: สมมติว่าวันนี้ระบบ AI ล่มทั่วโลกใช้งานไม่ได้เลย และคุณมีงานหรือภารกิจสำคัญที่ต้องทำ คุณจะรู้สึกอย่างไร?",
                options: [
                    "ไม่กระทบเลย สามารถทำงานต่อไปได้ตามปกติ",
                    "หงุดหงิดนิดหน่อย อาจจะทำงานช้าลงบ้างแต่จัดการได้",
                    "กระวนกระวายใจ เริ่มเครียดว่าจะทำงานเสร็จไม่ทัน",
                    "มืดแปดด้าน รู้สึกไปต่อไม่ถูก ทำงานไม่ได้เลย"
                ]
            },
            {
                title: "ข้อ 6: การใช้ AI ช่วยประหยัดเวลาให้คุณได้มาก ในความเป็นจริง คุณมักจะนำเวลาที่เหลือไปทำอะไรเป็นส่วนใหญ่?",
                options: [
                    "พักผ่อน ดูแลสุขภาพ หรือใช้เวลากับคนรอบข้าง (Offline time)",
                    "นำเวลาไปเรียนรู้ทักษะใหม่ๆ หรือพัฒนางานให้ดีขึ้น",
                    "รับงานเพิ่มขึ้น เพื่อให้ได้ปริมาณผลงานที่มากขึ้น",
                    "ใช้เวลาอยู่กับหน้าจอเหมือนเดิม (เช่น ไถโซเชียลมีเดีย, ดูซีรีส์)"
                ]
            }
        ];

        // ตัวแปรควบคุม State Machine และการทำข้อสอบ
        let currentState = "WELCOME"; 
        let currentQuestionIndex = 0;
        let selectedAnswer = null;
        let userAnswersScore = []; // อาร์เรย์เก็บคะแนนรายข้อ
        
        // ตัวคัดกรองระบบท่าทางค้าง (Debounce)
        let stableGesture = -1;
        let gestureCounter = 0;
        const REQUIRED_FRAMES = 12; // ต้องค้างท่าไว้ 12 เฟรมเพื่อทำงาน
        let isCooldown = false;

        // ฟังก์ชันหลักในการอัปเดตหน้าจอ [ส่วนที่ 2] และ [ส่วนที่ 3]
        function updateUI() {
            liveGestureBox.style.display = "block";
            
            if (currentState === "WELCOME") {
                statusMessage.innerText = "💡 กรุณาตรวจสอบความพร้อม";
                mainText.innerHTML = `
                    <h2 style="font-size:1.6rem; text-align:center; margin-top:20px;">
                        พร้อมจะตอบแบบสอบถามหรือยังครับ?<br>ถ้าพร้อมให้กำมือเป็นเลข 0 ชูหน้ากล้องครับ
                    </h2>
                `;
            } 
            else if (currentState === "QUESTION") {
                const currentData = questionsDatabase[currentQuestionIndex];
                statusMessage.innerText = `📋 กำลังทำข้อที่ ${currentQuestionIndex + 1} / 6`;
                
                let optionsHTML = "";
                currentData.options.forEach((opt, idx) => {
                    optionsHTML += `${idx + 1}. ${opt}<br>`;
                });

                mainText.innerHTML = `
                    <h2>${currentData.title}</h2>
                    <div class="options-list">
                        ${optionsHTML}
                    </div>
                    <div class="instruction-box">👉 ชูนิ้วคำตอบที่หน้ากล้องได้เลยครับ (เลือกเลข 1 ถึง ${currentData.options.length})</div>
                `;
            } 
            else if (currentState === "CONFIRM") {
                const currentData = questionsDatabase[currentQuestionIndex];
                statusMessage.innerText = `❓ ยืนยันคำตอบข้อที่ ${currentQuestionIndex + 1}`;
                
                const optionText = currentData.options[selectedAnswer - 1];

                mainText.innerHTML = `
                    <h2>คุณโชว์เลข: <span style="color:#d63031;">${selectedAnswer}</span></h2>
                    <p style="font-size:1.1rem; background:#f5f6fa; padding:10px; border-radius:6px;">
                        <b>คำตอบที่เลือก:</b> ${optionText}
                    </p>
                    <h3 style="margin-top:20px; margin-bottom:15px; color:#2d3436;">ยืนยันข้อความคำตอบนี้หรือไม่?</h3>
                    <div class="options-list" style="font-size:1.1rem;">
                        ✊ <b>ถ้ายืนยัน:</b> โชว์กำมือเป็นเลข 0 <br>
                        ✋ <b>ถ้าเปลี่ยนใจยกเลิก:</b> โชว์ 5 นิ้ว (เพื่อย้อนกลับไปเลือกข้อนี้ใหม่)
                    </div>
                `;
            } 
            else if (currentState === "THANKYOU") {
                statusMessage.innerText = "✅ แบบสอบถามเสร็จสมบูรณ์";
                
                // คำนวณผลรวมคะแนนทั้งหมด (เลือก 1=1, 2=2, 3=3, 4=4)
                let totalScore = userAnswersScore.reduce((sum, score) => sum + score, 0);

                mainText.innerHTML = `
                    <h2 style="text-align:center; color:#0984e3; font-size:1.8rem;">สรุปคะแนนรวมผลสอบ</h2>
                    <div style="text-align:center; margin:20px 0;">
                        <span style="font-size: 3.5rem; font-weight: bold; color: #00b894;">${totalScore}</span> 
                        <span style="font-size: 1.5rem; color:#636e72;"> คะแนนเต็ม 23</span>
                    </div>
                    
                    <div class="options-list" style="font-size:1rem; background:#f1f2f6; padding:15px; border-radius:8px;">
                        <b>รายละเอียดการคำนวณ:</b> คะแนนจะคิดตามหมายเลขข้อที่ท่านเลือกตอบสะสมรวมกันทั้ง 6 ข้อ
                    </div>
                    
                    <h2 style="color:#2ecc71; text-align:center; margin-top:20px;">🙏 ขอบคุณครับ 🙏</h2>
                    <div class="instruction-box" style="text-align:center;">🔄 ถ้าต้องการเล่นใหม่อีกครั้งให้กำมือเป็นเลข 0</div>
                `;
            }
        }

        // ระบบเปลี่ยนสถานะหน้าจอพร้อมหน่วงเวลาเอามือลงชั่วคราว
        function triggerStateTransition(nextState) {
            isCooldown = true;
            cooldownScreen.style.display = "flex";
            currentState = nextState;
            gestureCounter = 0;
            stableGesture = -1;

            setTimeout(() => {
                updateUI();
                cooldownScreen.style.display = "none";
                isCooldown = false;
            }, 1400); // หน่วงเวลา 1.4 วินาที
        }

        // ถอดรหัสตรรกะเงื่อนไขสัญญาณมือในแต่ละสถานะ
        function processGestureLogic(gesture) {
            if (isCooldown) return;

            if (currentState === "WELCOME") {
                if (gesture === 0) {
                    currentQuestionIndex = 0;
                    userAnswersScore = [];
                    triggerStateTransition("QUESTION");
                }
            } 
            else if (currentState === "QUESTION") {
                let maxAllowedOptions = questionsDatabase[currentQuestionIndex].options.length;
                // ตรวจสอบว่าชูนิ้วตรงตามจำนวนตัวเลือกในข้อนั้นๆ หรือไม่
                if (gesture >= 1 && gesture <= maxAllowedOptions) {
                    selectedAnswer = gesture;
                    triggerStateTransition("CONFIRM");
                }
            } 
            else if (currentState === "CONFIRM") {
                if (gesture === 5) {
                    selectedAnswer = null;
                    triggerStateTransition("QUESTION"); // ยกเลิก ย้อนกลับไปเลือกข้อเดิมใหม่
                } else if (gesture === 0) {
                    // ยืนยันคำตอบ บันทึกคะแนน (เลือกเลขอะไร ได้คะแนนเท่านั้นตามโจทย์)
                    userAnswersScore[currentQuestionIndex] = selectedAnswer;
                    selectedAnswer = null;

                    // ตรวจสอบว่ามีข้อถัดไปหรือไม่
                    if (currentQuestionIndex < questionsDatabase.length - 1) {
                        currentQuestionIndex++;
                        triggerStateTransition("QUESTION"); // ไปข้อถัดไป
                    } else {
                        triggerStateTransition("THANKYOU"); // ครบ 6 ข้อ ไปหน้าสรุปคะแนน
                    }
                }
            } 
            else if (currentState === "THANKYOU") {
                if (gesture === 0) {
                    currentQuestionIndex = 0;
                    userAnswersScore = [];
                    selectedAnswer = null;
                    triggerStateTransition("QUESTION"); // รีเซ็ตเพื่อเริ่มต้นเล่นรอบใหม่
                }
            }
        }

        // รับผลการประมวลผลวิดีโอจาก MediaPipe Hands
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            let currentFrameGesture = -1;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const handedness = results.multiHandedness[0].label;

                // วาดลายเส้นนิ้วมือลงบนภาพวิดีโอในส่วนที่ 1
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00cec9', lineWidth: 4});
                drawLandmarks(canvasCtx, landmarks, {color: '#ff7675', lineWidth: 1, radius: 3});

                // อัลกอริทึมนับจำนวนนิ้ว
                let count = 0;

                // 1. ตรวจสอบนิ้วโป้ง (เช็คการกางระนาบแนวนอน X)
                if (handedness === 'Left') {
                    if (landmarks[4].x > landmarks[3].x) count++;
                } else {
                    if (landmarks[4].x < landmarks[3].x) count++;
                }
                // 2. นิ้วชี้
                if (landmarks[8].y < landmarks[6].y) count++;
                // 3. นิ้วกลาง
                if (landmarks[12].y < landmarks[10].y) count++;
                // 4. นิ้วนาง
                if (landmarks[16].y < landmarks[14].y) count++;
                // 5. นิ้วก้อย
                if (landmarks[20].y < landmarks[18].y) count++;

                currentFrameGesture = count;
            }

            // แสดงผลการตรวจพบล่าสุดที่แถบข้อความส่วนที่ 2
            if (currentFrameGesture === 0) {
                currentGestureText.innerText = "0 (กำมือ)";
            } else if (currentFrameGesture > 0) {
                currentGestureText.innerText = currentFrameGesture + " นิ้ว";
            } else {
                currentGestureText.innerText = "รอชูนิ้วหน้ากล้อง...";
            }

            // ระบบตรวจสอบความเสถียรของมือ (Debounce ค้างท่า)
            if (currentFrameGesture !== -1 && !isCooldown) {
                if (currentFrameGesture === stableGesture) {
                    gestureCounter++;
                    if (gestureCounter >= REQUIRED_FRAMES) {
                        processGestureLogic(stableGesture);
                        gestureCounter = 0;
                    }
                } else {
                    stableGesture = currentFrameGesture;
                    gestureCounter = 0;
                }
            } else {
                gestureCounter = 0;
            }

            canvasCtx.restore();
        }

        // คอนฟิกไลบรารี AI มือ
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        // จัดการสั่งตรวจสอบและเรียกใช้กล้องเว็บแคมเครื่องมือ
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 850,
            height: 350
        });

        camera.start()
            .then(() => {
                updateUI(); // รันสเตท WELCOME เมื่อกล้องอนุมัติสำเร็จ
            })
            .catch((err) => {
                statusMessage.innerText = "❌ กล้องขัดข้อง";
                mainText.innerHTML = `
                    <h2>ไม่สามารถเปิดใช้งานระบบกล้องถ่ายภาพได้</h2>
                    <p style="color:red; font-weight:bold;">กรุณาคลิกปุ่ม "อนุญาตให้ใช้กล้อง" (Allow Camera) ด้านบนของหน้าต่างเว็บเบราว์เซอร์ เพื่อเข้าสู่แบบสอบถาม</p>
                `;
                console.error(err);
            });
    </script>
</body>
</html>
