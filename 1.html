<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>อ่านฉลากพัสดุด้วย OpenThai OCR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }
        h2 { text-align: center; }
        video, img {
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            background: #111;
            border-radius: 8px;
        }
        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2980b9;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: wait; }
        .green { background: #27ae60; }
        .gray { background: #7f8c8d; }
        label {
            display: block;
            margin: 14px 0 5px;
            font-weight: bold;
        }
        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        textarea { min-height: 90px; resize: vertical; }
        #status { margin-top: 12px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>สแกนฉลากพัสดุ</h2>

    <section id="cameraSection">
        <video id="video" autoplay playsinline></video>
        <button id="captureButton">ถ่ายภาพและอ่านข้อความ</button>
    </section>

    <section id="formSection" class="hidden">
        <img id="preview" alt="ภาพฉลากที่ถ่าย">

        <label for="name">ชื่อ-นามสกุล</label>
        <input id="name" type="text" autocomplete="off">

        <label for="address">ที่อยู่</label>
        <textarea id="address"></textarea>

        <label for="phone">เบอร์โทรศัพท์</label>
        <input id="phone" type="text" autocomplete="off">

        <label for="rawText">ข้อความที่ OCR อ่านได้ (ตรวจสอบได้)</label>
        <textarea id="rawText"></textarea>

        <button id="saveButton" class="green">บันทึกลง Google Sheet</button>
        <button id="retakeButton" class="gray">ถ่ายภาพใหม่</button>
    </section>

    <div id="status"></div>
</div>

<script>
    const video = document.getElementById('video');
    const cameraSection = document.getElementById('cameraSection');
    const formSection = document.getElementById('formSection');
    const statusBox = document.getElementById('status');
    const preview = document.getElementById('preview');

    const nameInput = document.getElementById('name');
    const addressInput = document.getElementById('address');
    const phoneInput = document.getElementById('phone');
    const rawTextInput = document.getElementById('rawText');

    // ใส่ URL Google Apps Script เดิมของคุณ
    const WEB_APP_URL = 'ใส่_URL_GOOGLE_APPS_SCRIPT_ของคุณ';

    let stream;

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: 'environment' },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });
            video.srcObject = stream;
        } catch (error) {
            statusBox.textContent =
                'เปิดกล้องไม่ได้: ' + error.message +
                ' — อนุญาตการใช้กล้องและเปิดเว็บผ่าน localhost หรือ HTTPS';
        }
    }

    startCamera();

    document.getElementById('captureButton').addEventListener('click', async () => {
        if (!video.videoWidth) {
            statusBox.textContent = 'กล้องยังไม่พร้อม กรุณารอสักครู่';
            return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        const blob = await new Promise(resolve =>
            canvas.toBlob(resolve, 'image/jpeg', 0.95)
        );

        preview.src = URL.createObjectURL(blob);
        cameraSection.classList.add('hidden');
        formSection.classList.remove('hidden');

        statusBox.textContent = 'กำลังส่งภาพไปอ่านด้วย OpenThai OCR...';

        try {
            const formData = new FormData();
            formData.append('file', blob, 'parcel-label.jpg');

            const response = await fetch('/api/ocr', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.details || result.error || 'OCR ล้มเหลว');
            }

            rawTextInput.value = result.text || '';
            fillFields(result.text || '');
            statusBox.textContent =
                'อ่านเสร็จแล้ว กรุณาตรวจชื่อและข้อมูลก่อนบันทึก';
        } catch (error) {
            console.error(error);
            statusBox.textContent = 'อ่านภาพไม่สำเร็จ: ' + error.message;
        }
    });

    function fillFields(text) {
        const lines = text
            .split(/\r?\n/)
            .map(line => line.replace(/\s+/g, ' ').trim())
            .filter(Boolean);

        const phoneMatch = text.match(/0\d{1,2}[\s-]?\d{3}[\s-]?\d{4}/);
        phoneInput.value = phoneMatch ? phoneMatch[0].replace(/[\s-]/g, '') : '';

        const recipientLabel =
            /^(?:ชื่อผู้รับ|ผู้รับ|recipient|ship\s*to|to)\s*[:：\-]?\s*/i;
        const honorific = /^(?:คุณ|นาย|นางสาว|นาง|น\.ส\.|ดร\.)\s*/;

        const addressHint =
            /บ้านเลขที่|หมู่ที่|ซอย|ถนน|แขวง|ตำบล|เขต|อำเภอ|จังหวัด|รหัสไปรษณีย์|โทรศัพท์|tracking/i;

        let selectedName = '';
        let selectedScore = 0;

        for (const originalLine of lines) {
            let candidate = originalLine.replace(
                /0\d{1,2}[\s-]?\d{3}[\s-]?\d{4}/g, ''
            ).trim();

            const hasRecipientLabel = recipientLabel.test(candidate);
            candidate = candidate.replace(recipientLabel, '').trim();

            if (!candidate || addressHint.test(candidate)) continue;
            if ((candidate.match(/\d/g) || []).length >= 3) continue;

            const thaiLetters = (candidate.match(/[ก-๙]/g) || []).length;
            const latinLetters = (candidate.match(/[A-Za-z]/g) || []).length;
            if (thaiLetters < 2 && latinLetters < 5) continue;

            let score = thaiLetters + Math.min(latinLetters, 10);
            if (hasRecipientLabel) score += 40;
            if (honorific.test(candidate)) score += 25;

            if (score > selectedScore) {
                selectedScore = score;
                selectedName = candidate;
            }
        }

        // ไม่เดาชื่อจากบรรทัดแรก ถ้า OCR ไม่พบผู้รับที่น่าเชื่อถือให้เว้นว่าง
        nameInput.value = selectedName;

        addressInput.value = lines
            .filter(line => line !== selectedName)
            .filter(line => !/0\d{1,2}[\s-]?\d{3}[\s-]?\d{4}/.test(line))
            .join(' ');
    }

    document.getElementById('retakeButton').addEventListener('click', () => {
        formSection.classList.add('hidden');
        cameraSection.classList.remove('hidden');
        statusBox.textContent = '';
        nameInput.value = '';
        addressInput.value = '';
        phoneInput.value = '';
        rawTextInput.value = '';
    });

    document.getElementById('saveButton').addEventListener('click', async event => {
        const button = event.currentTarget;
        button.disabled = true;
        statusBox.textContent = 'กำลังบันทึกข้อมูล...';

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: nameInput.value,
                    address: addressInput.value,
                    others: phoneInput.value
                })
            });

            statusBox.textContent =
                'ส่งคำขอบันทึกแล้ว หากชีตไม่ขึ้นข้อมูล ให้ตรวจสอบ Google Apps Script';
        } catch (error) {
            statusBox.textContent = 'บันทึกไม่สำเร็จ: ' + error.message;
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
