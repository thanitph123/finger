<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI อ่านสติ๊กเกอร์พัสดุและบันทึก Google Sheets (Local OCR)</title>
    <!-- โหลด Tesseract.js สำหรับอ่านข้อความจากภาพบนเครื่อง (100% Offline / Local) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .cam-box, .preview-box { text-align: center; margin-bottom: 20px; }
        video, canvas, img { width: 100%; max-height: 300px; border-radius: 8px; object-fit: cover; background: #000; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        button.success { background: #2ecc71; }
        button.success:hover { background: #27ae60; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        .status { margin-top: 15px; text-align: center; font-weight: bold; color: #e74c3c; line-height: 1.5; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>สแกนสติ๊กเกอร์พัสดุ</h2>
    
    <!-- ส่วนกล้องสด -->
    <div id="camera-section">
        <div class="cam-box">
            <!-- เพิ่ม playsinline, autoplay, muted เพื่อให้เบราว์เซอร์ยอมเล่นวิดีโออัตโนมัติ -->
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" class="hidden"></canvas>
        </div>
        <button id="capture-btn">ถ่ายภาพสติ๊กเกอร์</button>
    </div>

    <!-- ส่วนแสดงภาพถ่ายและฟอร์มแก้ไขข้อมูล -->
    <div id="form-section" class="hidden">
        <div class="preview-box">
            <img id="preview" alt="Captured Image">
        </div>
        
        <div class="form-group">
            <label>ชื่อ-นามสกุล (Column A):</label>
            <input type="text" id="name" placeholder="กำลังประมวลผล...">
        </div>
        
        <div class="form-group">
            <label>ที่อยู่ (Column B):</label>
            <textarea id="address" placeholder="กำลังประมวลผล..."></textarea>
        </div>
        
        <div class="form-group">
            <label>ข้อมูลอื่นๆ เช่น เบอร์โทร (Column C):</label>
            <input type="text" id="others" placeholder="เบอร์โทร หรือข้อมูลเพิ่มเติม">
        </div>
        <button id="save-btn" class="success">บันทึกข้อมูลลง Google Sheet</button>
        <button id="retake-btn" style="background: #95a5a6; margin-top: 5px;">ถ่ายภาพใหม่</button>
    </div>

    <div id="status" class="status"></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const captureBtn = document.getElementById('capture-btn');
    const saveBtn = document.getElementById('save-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const cameraSection = document.getElementById('camera-section');
    const formSection = document.getElementById('form-section');
    const statusDiv = document.getElementById('status');
    const inputName = document.getElementById('name');
    const inputAddress = document.getElementById('address');
    const inputOthers = document.getElementById('others');

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx0IQae0kP2gk8DHSuSfOmmofZ47mh7gEVFBeuLJZKPViuIOI5q53zylw3SbVZxGAdJ/exec";

    let currentStream = null;

    // ฟังก์ชันเปิดกล้องวิดีโอสด
    async function initCamera() {
        // หยุด Stream เดิมก่อน (ถ้ามี)
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        // รายการ constraints: ลองหากล้องหลังก่อน ถ้าไม่พบให้เปิดกล้องตัวไหนก็ได้
        const constraintsList = [
            { video: { facingMode: { ideal: "environment" } }, audio: false },
            { video: true, audio: false }
        ];

        let streamOpened = false;

        for (const constraints of constraintsList) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;
                
                // สั่งเล่นวิดีโอสดทันทีเมื่อพร้อม
                video.onloadedmetadata = () => {
                    video.play().catch(e => console.log("Video play error:", e));
                };

                streamOpened = true;
                statusDiv.innerText = "";
                break;
            } catch (err) {
                console.warn("ไม่สามารถเปิดด้วยเงื่อนไข:", constraints, err);
            }
        }

        if (!streamOpened) {
            statusDiv.innerText = "ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบสิทธิ์การใช้งานกล้องในเบราว์เซอร์ หรือเปิดผ่าน HTTPS / Localhost";
        }
    }

    // เปิดกล้องทันทีเมื่อโหลดหน้าเว็บ
    initCamera();

    // ปุ่มถ่ายภาพจากหน้าจอกล้อง
    captureBtn.addEventListener('click', () => {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // ปรับภาพให้คมชัด ขาว-ดำ เพื่อเพิ่มความแม่นยำในการอ่านชื่อและภาษาไทย
        preprocessImage(ctx, canvas.width, canvas.height);

        const imageDataURL = canvas.toDataURL('image/jpeg');
        preview.src = imageDataURL;

        // สลับไปหน้าพรีวิวและฟอร์ม
        cameraSection.classList.add('hidden');
        formSection.classList.remove('hidden');

        // เริ่มอ่าน OCR ด้วย Tesseract
        processImageWithLocalOCR(imageDataURL);
    });

    // ปรับแต่งภาพ (Grayscale & Contrast Boost)
    function preprocessImage(ctx, width, height) {
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
            const contrast = (gray < 125) ? gray * 0.6 : Math.min(255, gray * 1.3);
            data[i] = contrast;
            data[i+1] = contrast;
            data[i+2] = contrast;
        }
        ctx.putImageData(imgData, 0, 0);
    }

    // ถ่ายภาพใหม่
    retakeBtn.addEventListener('click', () => {
        formSection.classList.add('hidden');
        cameraSection.classList.remove('hidden');
        statusDiv.style.color = "#e74c3c";
        statusDiv.innerText = "";
        inputName.value = "";
        inputAddress.value = "";
        inputOthers.value = "";
        initCamera(); // เปิดกล้องใหม่อีกครั้ง
    });

    // ฟังก์ชัน OCR อ่านข้อความ
    async function processImageWithLocalOCR(dataUrl) {
        statusDiv.style.color = "#3498db";
        statusDiv.innerText = "AI กำลังแกะรอยข้อความจากภาพ (Local Processing)...";
        
        try {
            const result = await Tesseract.recognize(
                dataUrl,
                'tha+eng',
                { 
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            statusDiv.innerText = `กำลังอ่านข้อความ: ${Math.round(m.progress * 100)}%`;
                        }
                    }
                }
            );
            const text = result.data.text;
            console.log("Raw OCR Text:", text);

            parseLabelText(text);
            statusDiv.style.color = "#27ae60";
            statusDiv.innerText = "อ่านข้อมูลสำเร็จ กรุณาตรวจสอบและแก้ไขหากจำเป็น";
        } catch (error) {
            statusDiv.style.color = "#e74c3c";
            statusDiv.innerText = "เกิดข้อผิดพลาดในการอ่านภาพ: " + error.message;
            inputName.value = "";
            inputAddress.value = "";
        }
    }

    // ฟังก์ชันคัดแยกชื่อผู้รับ เบอร์โทร และที่อยู่
    function parseLabelText(fullText) {
        const lines = fullText.split('\n')
            .map(l => l.trim().replace(/[|`'"]/g, ''))
            .filter(l => l.length > 2);
        
        let detectedPhone = "";
        let detectedName = "";
        let addressLines = [];

        const phoneRegex = /(0[0-9]{1,2}[-\s]?[0-9]{3}[-\s]?[0-9]{4})/g;
        
        const nameKeywords = [
            "คุณ", "นาย", "นาง", "น.ส.", "นส.", "เด็กชาย", "ด.ช.", "เด็กหญิง", "ด.ญ.",
            "ผู้รับ", "to:", "name:", "ชื่อผู้รับ", "ชื่อ", "attn:"
        ];
        const senderKeywords = ["ผู้ส่ง", "from:", "sender"];

        lines.forEach(line => {
            const lowerLine = line.toLowerCase();

            if (phoneRegex.test(line)) {
                const matchedPhone = line.match(phoneRegex)[0];
                if (!detectedPhone) detectedPhone = matchedPhone;
            }

            if (senderKeywords.some(kw => lowerLine.includes(kw))) {
                return; // ข้ามบรรทัดผู้ส่ง
            }

            if (!detectedName && nameKeywords.some(kw => lowerLine.includes(kw))) {
                let cleanName = line
                    .replace(/ผู้รับ\s*[:：]?/i, "")
                    .replace(/to\s*[:：]?/i, "")
                    .replace(/name\s*[:：]?/i, "")
                    .replace(/ชื่อผู้รับ\s*[:：]?/i, "")
                    .replace(/ชื่อ\s*[:：]?/i, "")
                    .trim();
                
                if (cleanName.length > 0) detectedName = cleanName;
            } else {
                const cleanAddress = line.replace(/ที่อยู่\s*[:：]?/i, "").trim();
                if (cleanAddress) addressLines.push(cleanAddress);
            }
        });

        // หากไม่พบคีย์เวิร์ด ให้เลือกบรรทัดแรกที่ไม่ใช่เบอร์โทรและไม่ใช่ผู้ส่ง
        if (!detectedName && lines.length > 0) {
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const lowerLine = line.toLowerCase();
                if (!phoneRegex.test(line) && !senderKeywords.some(kw => lowerLine.includes(kw)) && line.length > 3) {
                    detectedName = line;
                    addressLines = lines.filter((_, idx) => idx !== i && !phoneRegex.test(lines[idx]));
                    break;
                }
            }
        }

        inputName.value = detectedName || "";
        inputAddress.value = addressLines.join("\n") || "";
        inputOthers.value = detectedPhone || "";
    }

    // บันทึกลง Google Sheets
    saveBtn.addEventListener('click', async () => {
        const payload = {
            name: inputName.value,
            address: inputAddress.value,
            others: inputOthers.value
        };

        statusDiv.style.color = "#3498db";
        statusDiv.innerText = "กำลังบันทึกข้อมูลลง Google Sheet...";
        saveBtn.disabled = true;

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            statusDiv.style.color = "#27ae60";
            statusDiv.innerText = "บันทึกข้อมูลเรียบร้อยแล้ว!";

            setTimeout(() => {
                retakeBtn.click();
                statusDiv.innerText = "";
                saveBtn.disabled = false;
            }, 2000);
        } catch (error) {
            statusDiv.style.color = "#e74c3c";
            statusDiv.innerText = "เกิดข้อผิดพลาดในการบันทึก: " + error;
            saveBtn.disabled = false;
        }
    });
</script>
</body>
</html>
