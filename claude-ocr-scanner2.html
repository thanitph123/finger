<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สแกนสติ๊กเกอร์พัสดุ (Thai OCR) → Google Sheets</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
  .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,.1); }
  h2 { text-align: center; color: #2c3e50; margin-top: 0; }
  .cam-box, .preview-box { text-align: center; margin-bottom: 20px; }
  video, img { width: 100%; max-height: 320px; border-radius: 8px; object-fit: contain; background: #000; }
  button { background: #3498db; color: #fff; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
  button:hover { background: #2980b9; }
  button.success { background: #2ecc71; }
  button.success:hover { background: #27ae60; }
  button.gray { background: #95a5a6; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .form-group { margin-bottom: 15px; }
  label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
  input[type=text], textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
  textarea { resize: vertical; height: 90px; }
  .opts { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; flex-wrap: wrap; }
  .opts label { display: inline; font-weight: normal; }
  .opts select { width: auto; padding: 6px; }
  .status { margin-top: 15px; text-align: center; font-weight: bold; color: #e74c3c; }
  details { margin-top: 12px; font-size: 12px; }
  pre { white-space: pre-wrap; background: #f0f0f0; padding: 8px; border-radius: 6px; }
  .hidden { display: none; }
  .sel-wrap { position: relative; touch-action: none; user-select: none; }
  #preview { max-height: none; height: auto; object-fit: fill; display: block; }
  #sel { position: absolute; display: none; border: 2px solid #e67e22; background: rgba(230,126,34,.15); pointer-events: none; }
  .hint { font-size: 13px; color: #777; margin: 6px 0 0; }
</style>
</head>
<body>
<div class="container">
  <h2>สแกนสติ๊กเกอร์พัสดุ</h2>

  <div id="camera-section">
    <div class="cam-box"><video id="video" autoplay playsinline muted></video></div>
    <button id="capture-btn">ถ่ายภาพสติ๊กเกอร์</button>
    <button id="upload-btn" class="gray">เลือกรูปจากเครื่อง</button>
    <input type="file" id="file-input" accept="image/*" class="hidden">
    <div class="opts">
      <label><input type="checkbox" id="binarize" checked> ปรับภาพขาว-ดำ (ช่วยเมื่อแสงไม่เท่ากัน)</label>
      <label><input type="checkbox" id="deep" checked> โหมดละเอียด (ช้าลง แต่แม่นขึ้น)</label>
      <label>โหมดอ่าน:
        <select id="psm">
          <option value="6">บล็อกข้อความเดียว (แนะนำ)</option>
          <option value="3">อัตโนมัติ</option>
          <option value="4">หลายบรรทัด/ขนาดต่างกัน</option>
          <option value="11">ข้อความกระจัดกระจาย</option>
        </select>
      </label>
    </div>
  </div>

  <div id="form-section" class="hidden">
    <div class="preview-box"><div class="sel-wrap" id="sel-wrap"><img id="preview" alt="Captured"><div id="sel"></div></div>
      <p class="hint">ถ้าชื่อยังไม่ชัด: ลากกรอบบนรูปให้ครอบเฉพาะชื่อผู้รับ/ชื่อบริษัท เพื่ออ่านซ้ำอย่างละเอียด</p></div>
    <div class="form-group"><label>ชื่อ-นามสกุล (Column A):</label><input type="text" id="name"></div>
    <div class="form-group"><label>ที่อยู่ (Column B):</label><textarea id="address"></textarea></div>
    <div class="form-group"><label>เบอร์โทร / อื่นๆ (Column C):</label><input type="text" id="others"></div>
    <button id="save-btn" class="success">บันทึกข้อมูลลง Google Sheet</button>
    <button id="retake-btn" class="gray">ถ่ายภาพใหม่</button>
    <details><summary>ข้อความดิบจาก OCR (ไว้ตรวจสอบ)</summary><pre id="raw"></pre></details>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), preview = $('preview'), statusDiv = $('status');
const inputName = $('name'), inputAddress = $('address'), inputOthers = $('others');

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx0IQae0kP2gk8DHSuSfOmmofZ47mh7gEVFBeuLJZKPViuIOI5q53zylw3SbVZxGAdJ/exec";
// โมเดลภาษาไทยแบบ "best" แม่นกว่าค่าเริ่มต้น (fast) มาก ไฟล์ใหญ่กว่าแต่ถูกแคชไว้หลังโหลดครั้งแรก
const LANG_PATH = "https://tessdata.projectnaptha.com/4.0.0_best";

const TH = '\\u0E00-\\u0E7F';

/* ---------------- กล้อง ---------------- */
navigator.mediaDevices.getUserMedia({
  video: { facingMode: 'environment', width: { ideal: 3840 }, height: { ideal: 2160 } }
}).then(stream => {
  video.srcObject = stream;
  const track = stream.getVideoTracks()[0];
  // พยายามเปิดโฟกัสต่อเนื่อง (ถ้าเครื่องรองรับ)
  track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
}).catch(err => { statusDiv.innerText = "ไม่สามารถเปิดกล้องได้: " + err; });

/* ---------------- Tesseract worker (สร้างครั้งเดียว ใช้ซ้ำ) ---------------- */
let workerPromise = null;
function getWorker() {
  if (!workerPromise) {
    workerPromise = (async () => {
      const w = await Tesseract.createWorker('tha+eng', 1, {
        langPath: LANG_PATH,
        logger: m => {
          const pct = Math.round((m.progress || 0) * 100);
          if (m.status === 'recognizing text') statusDiv.innerText = `กำลังอ่านข้อความ: ${pct}%`;
          else if (/loading/.test(m.status)) statusDiv.innerText = `กำลังโหลดโมเดลภาษา (${pct}%) ครั้งแรกอาจใช้เวลาสักครู่`;
        }
      });
      await w.setParameters({ preserve_interword_spaces: '1', user_defined_dpi: '300' });
      return w;
    })().catch(e => { workerPromise = null; throw e; });
  }
  return workerPromise;
}
getWorker().then(() => { if (statusDiv.innerText.startsWith('กำลังโหลด')) statusDiv.innerText = ''; }).catch(() => {});

/* ---------------- ถ่ายภาพ / เลือกไฟล์ ---------------- */
$('capture-btn').addEventListener('click', () => {
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  handleCanvas(c);
});
$('upload-btn').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src);
    handleCanvas(c);
  };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
});

function handleCanvas(c) {
  lastSrc = c; $('sel').style.display = 'none';
  preview.src = c.toDataURL('image/jpeg', 0.9);
  $('camera-section').classList.add('hidden');
  $('form-section').classList.remove('hidden');
  runOCR(c);
}

$('retake-btn').addEventListener('click', () => {
  $('form-section').classList.add('hidden');
  $('camera-section').classList.remove('hidden');
  statusDiv.innerText = '';
  inputName.value = inputAddress.value = inputOthers.value = '';
  $('raw').textContent = '';
});

/* ---------------- ปรับภาพก่อน OCR ---------------- */
// ขยายภาพ + ขอบขาว + grayscale + ยืด contrast + (เลือกได้) adaptive threshold
function preprocess(src, binarize) {
  const TARGET = 2400, PAD = 30;
  const scale = Math.min(Math.max(TARGET / Math.max(src.width, src.height), 0.5), 3);
  const w = Math.round(src.width * scale) + PAD * 2;
  const h = Math.round(src.height * scale) + PAD * 2;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  x.imageSmoothingQuality = 'high';
  x.drawImage(src, PAD, PAD, w - PAD * 2, h - PAD * 2);

  const img = x.getImageData(0, 0, w, h), d = img.data, n = w * h;
  const g = new Uint8ClampedArray(n), hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    const v = (0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2]) | 0;
    g[i] = v; hist[v]++;
  }
  // ยืด contrast ที่เปอร์เซ็นไทล์ 1–99
  let lo = 0, hi = 255, acc = 0;
  while (lo < 255 && (acc += hist[lo]) < n * 0.01) lo++;
  acc = 0;
  while (hi > 0 && (acc += hist[hi]) < n * 0.01) hi--;
  const rng = Math.max(hi - lo, 1);
  for (let i = 0; i < n; i++) g[i] = (g[i] - lo) * 255 / rng;

  let out = g;
  if (binarize) {
    // adaptive mean threshold ด้วย integral image (รับมือเงา/แสงไม่เท่ากัน)
    const W = w + 1, I = new Uint32Array(W * (h + 1));
    for (let y = 0; y < h; y++) {
      let row = 0;
      for (let xx = 0; xx < w; xx++) { row += g[y * w + xx]; I[(y + 1) * W + xx + 1] = I[y * W + xx + 1] + row; }
    }
    const r = Math.max(15, (w / 24) | 0);
    out = new Uint8ClampedArray(n);
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
      for (let xx = 0; xx < w; xx++) {
        const x0 = Math.max(0, xx - r), x1 = Math.min(w, xx + r + 1);
        const sum = I[y1 * W + x1] - I[y0 * W + x1] - I[y1 * W + x0] + I[y0 * W + x0];
        const mean = sum / ((x1 - x0) * (y1 - y0));
        out[y * w + xx] = g[y * w + xx] > mean * 0.88 ? 255 : 0;
      }
    }
  }
  for (let i = 0, j = 0; i < n; i++, j += 4) { d[j] = d[j + 1] = d[j + 2] = out[i]; d[j + 3] = 255; }
  x.putImageData(img, 0, 0);
  return c;
}

/* ---------------- ตัวช่วยเพิ่มความแม่นยำ ---------------- */
let lastWarn = '';
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// ตรวจความคมชัด (variance ของ Laplacian บนภาพย่อ) ค่าต่ำ = เบลอ
function sharpness(src) {
  const s = 640 / Math.max(src.width, src.height);
  const w = Math.max(3, Math.round(src.width * s)), h = Math.max(3, Math.round(src.height * s));
  const c = mkCanvas(w, h), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(src, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
  let sum = 0, sq = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    const i = y * w + xx, v = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w];
    sum += v; sq += v * v; n++;
  }
  return sq / n - (sum / n) ** 2;
}

// หามุมเอียงของบรรทัดข้อความ (เรเดียน) ด้วย projection profile
function estimateSkew(src) {
  const s = 500 / Math.max(src.width, src.height);
  const w = Math.max(3, Math.round(src.width * s)), h = Math.max(3, Math.round(src.height * s));
  const c = mkCanvas(w, h), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(src, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  let mean = 0;
  for (let i = 0; i < w * h; i++) { g[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2]; mean += g[i]; }
  mean /= w * h;
  const xs = [], ys = [];
  for (let y = 0; y < h; y += 1) for (let xx = y & 1; xx < w; xx += 2) if (g[y * w + xx] < mean * 0.75) { xs.push(xx); ys.push(y); }
  if (xs.length < 200) return 0;
  const bins = new Float32Array(h + 2 * w + 2);
  const score = a => {
    const sin = Math.sin(a), cos = Math.cos(a); bins.fill(0);
    for (let i = 0; i < xs.length; i++) bins[Math.round(-xs[i] * sin + ys[i] * cos + w)]++;
    let t = 0; for (let i = 0; i < bins.length; i++) t += bins[i] * bins[i];
    return t;
  };
  const rad = Math.PI / 180;
  let best = 0, bs = -1;
  for (let dg = -12; dg <= 12; dg++) { const sc = score(dg * rad); if (sc > bs) { bs = sc; best = dg; } }
  let fine = best;
  for (let dg = best - 0.9; dg <= best + 0.9; dg += 0.15) { const sc = score(dg * rad); if (sc > bs) { bs = sc; fine = dg; } }
  return fine * rad;
}

function rotateCanvas(src, a) {
  const cos = Math.abs(Math.cos(a)), sin = Math.abs(Math.sin(a));
  const w = Math.round(src.width * cos + src.height * sin), h = Math.round(src.width * sin + src.height * cos);
  const c = mkCanvas(w, h), x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  x.translate(w / 2, h / 2); x.rotate(a);
  x.drawImage(src, -src.width / 2, -src.height / 2);
  return c;
}

// อ่านซ้ำเฉพาะบรรทัดที่ confidence ต่ำ ด้วยโหมดบรรทัดเดียว (PSM 7) ซึ่งแม่นกว่าสำหรับไทย
async function refineLines(worker, data, proc) {
  await worker.setParameters({ tessedit_pageseg_mode: '7' });
  for (let i = 0; i < data.lines.length; i++) {
    const l = data.lines[i];
    if ((l.confidence >= 80 && !isNameLine(l.text)) || !l.bbox) continue;
    statusDiv.innerText = `กำลังอ่านซ้ำบรรทัดที่ ${i + 1}/${data.lines.length}...`;
    const p = 12, x0 = Math.max(0, l.bbox.x0 - p), y0 = Math.max(0, l.bbox.y0 - p);
    const w = Math.min(proc.width, l.bbox.x1 + p) - x0, h = Math.min(proc.height, l.bbox.y1 + p) - y0;
    if (w < 10 || h < 10) continue;
    const c = mkCanvas(w + 40, h + 40), x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(proc, x0, y0, w, h, 20, 20, w, h);
    const isName = isNameLine(l.text);
    const d = isName ? await rereadCanvas(worker, c) : (await worker.recognize(c)).data;
    if (d && d.text.trim() && d.confidence > l.confidence) { l.text = d.text; l.confidence = d.confidence; l.words = d.words; }
    if (isName) await worker.setParameters({ tessedit_pageseg_mode: '7' });
  }
  data.text = data.lines.map(l => l.text.replace(/\n$/, '')).join('\n');
  await worker.setParameters({ tessedit_pageseg_mode: $('psm').value });
}

// โหมดละเอียด: เช็คความเบลอ → ปรับมุมเอียง → อ่านทั้งแบบขาวดำและเทา เลือกผลที่มั่นใจกว่า → อ่านซ้ำบรรทัดที่อ่านยาก
async function ocrBest(src) {
  const deep = $('deep').checked;
  statusDiv.innerText = 'กำลังวิเคราะห์ภาพ...';
  await new Promise(r => setTimeout(r, 30));
  lastWarn = sharpness(src) < 60 ? 'คำเตือน: ภาพอาจเบลอ ลองถ่ายใหม่ให้นิ่งและโฟกัสชัด' : '';
  let base = src;
  if (deep) { const a = estimateSkew(src); if (Math.abs(a) > 0.005) base = rotateCanvas(src, -a); }
  const worker = await getWorker();
  await worker.setParameters({ tessedit_pageseg_mode: $('psm').value });
  const variants = deep ? [true, false] : [$('binarize').checked];
  let best = null, bestProc = null;
  for (const b of variants) {
    const proc = preprocess(base, b);
    const r = await worker.recognize(proc);
    if (!best || r.data.confidence > best.data.confidence) { best = r; bestProc = proc; }
  }
  if (deep && best.data.lines && best.data.lines.length) await refineLines(worker, best.data, bestProc);
  return best;
}

/* ---------------- โฟกัสชื่อผู้รับ / บริษัท ---------------- */
const COMPANY_RE = /^(บริษัท|บจก|บมจ|หจก|ห้างหุ้นส่วน|ร้าน|สหกรณ์|ธนาคาร|โรงเรียน|มหาวิทยาลัย|โรงพยาบาล)|จำกัด|co\.?,?\s*ltd|company|limited|\binc\b/i;
const NAME_RE = /(คุณ|นาย|นางสาว|นาง|น\.ส\.|ด\.ช\.|ด\.ญ\.|Mr\.?|Mrs\.?|Ms\.?|บริษัท|บจก|บมจ|หจก|ห้างหุ้นส่วน|จำกัด|co\.?,?ltd|company|limited)/i;
const isNameLine = t => NAME_RE.test(t.replace(/\s+/g, ''));
let lastSrc = null, busy = false;

// ประกอบคำจากกล่องคำของ Tesseract โดยใช้ "ระยะห่างจริง" ตัดสินว่าตรงไหนเป็นช่องว่าง (แยกชื่อ/นามสกุลได้แม่นกว่า)
function joinWords(words) {
  const ws = words.filter(w => w.text && w.text.trim() && w.bbox).sort((a, b) => a.bbox.x0 - b.bbox.x0);
  if (!ws.length) return '';
  const hs = ws.map(w => w.bbox.y1 - w.bbox.y0).sort((a, b) => a - b), h = hs[hs.length >> 1] || 1;
  let out = ws[0].text.trim();
  for (let i = 1; i < ws.length; i++) out += (ws[i].bbox.x0 - ws[i - 1].bbox.x1 > h * 0.22 ? ' ' : '') + ws[i].text.trim();
  return out;
}
function cleanThaiKeep(s) {
  s = s.replace(/[|¦\\_~`^*“”"]/g, ' ').replace(/[๐-๙]/g, d => THAI_DIGITS.indexOf(d))
       .replace(/\u0E4D\u0E32/g, '\u0E33').replace(/([\u0E48-\u0E4B])\1+/g, '$1');
  return s.replace(/[ \t]{2,}/g, ' ').trim();
}
function cleanName(s) {
  if (!s) return '';
  return cleanThaiKeep(s)
    .replace(/^(ชื่อ[-\s]?(นามสกุล|สกุล)?|ผู้รับ(สินค้า)?|ส่งถึง)\s*[:：]?\s*/, '')
    .replace(/^(ship to|to)\s*[:：]\s*|^(ship to|to)\s+/i, '')
    .replace(/[^\u0E00-\u0E7FA-Za-z0-9.\-&()' ]/g, ' ')
    .replace(/จ[ําำ]?กัด/g, 'จำกัด')
    .replace(/\s{2,}/g, ' ').trim();
}
// อ่านซ้ำทั้งโหมดบรรทัดเดียว (7) และบล็อก (6) แล้วเลือกผลที่มั่นใจกว่า
async function rereadCanvas(worker, c) {
  let best = null;
  for (const psm of ['7', '6']) {
    await worker.setParameters({ tessedit_pageseg_mode: psm });
    const r = await worker.recognize(c);
    if (r.data.text.trim() && (!best || r.data.confidence > best.confidence)) best = r.data;
  }
  return best;
}
// อ่านเฉพาะกรอบที่ผู้ใช้ลากครอบชื่อ: ขยายภาพ × (ขาวดำ/เทา) × (PSM 7/6) เลือกผลดีที่สุด
async function readNameRegion(src, r) {
  if (busy) { statusDiv.innerText = 'กำลังอ่านภาพอยู่ รอให้เสร็จก่อนแล้วค่อยลากกรอบ'; return; }
  busy = true;
  statusDiv.style.color = '#e74c3c';
  statusDiv.innerText = 'กำลังอ่านชื่อในกรอบอย่างละเอียด...';
  try {
    const crop = mkCanvas(Math.round(r.w), Math.round(r.h));
    crop.getContext('2d').drawImage(src, r.x, r.y, r.w, r.h, 0, 0, crop.width, crop.height);
    const worker = await getWorker();
    let best = null;
    for (const bin of [true, false]) {
      const d = await rereadCanvas(worker, preprocess(crop, bin));
      if (d && (!best || d.confidence > best.confidence)) best = d;
    }
    await worker.setParameters({ tessedit_pageseg_mode: $('psm').value });
    if (!best) { statusDiv.innerText = 'อ่านในกรอบไม่ได้ ลองลากใหม่ให้พอดีบรรทัดชื่อ'; return; }
    const txt = (best.lines && best.lines.length)
      ? best.lines.map(l => (l.words && l.words.length) ? joinWords(l.words) : l.text).join(' ')
      : best.text;
    inputName.value = cleanName(txt);
    statusDiv.innerText = `อ่านชื่อในกรอบแล้ว (ความมั่นใจ ${Math.round(best.confidence)}%) กรุณาตรวจสอบ`;
  } catch (e) {
    statusDiv.innerText = 'อ่านในกรอบไม่สำเร็จ: ' + (e.message || e);
  } finally { busy = false; }
}
// ลากกรอบบนรูปตัวอย่าง
(function () {
  const wrap = $('sel-wrap'), box = $('sel');
  let sx = 0, sy = 0, drag = false;
  const pos = e => {
    const r = preview.getBoundingClientRect();
    return { x: Math.min(Math.max(e.clientX - r.left, 0), r.width), y: Math.min(Math.max(e.clientY - r.top, 0), r.height), r };
  };
  wrap.addEventListener('pointerdown', e => {
    const p = pos(e); sx = p.x; sy = p.y; drag = true; wrap.setPointerCapture(e.pointerId);
    Object.assign(box.style, { display: 'block', left: sx + 'px', top: sy + 'px', width: '0px', height: '0px' });
  });
  wrap.addEventListener('pointermove', e => {
    if (!drag) return; const p = pos(e);
    Object.assign(box.style, { left: Math.min(sx, p.x) + 'px', top: Math.min(sy, p.y) + 'px', width: Math.abs(p.x - sx) + 'px', height: Math.abs(p.y - sy) + 'px' });
  });
  wrap.addEventListener('pointerup', e => {
    if (!drag) return; drag = false;
    const p = pos(e), k = lastSrc.width / p.r.width;
    const x = Math.min(sx, p.x) * k, y = Math.min(sy, p.y) * k, w = Math.abs(p.x - sx) * k, h = Math.abs(p.y - sy) * k;
    if (w < 30 || h < 15) { box.style.display = 'none'; return; }
    readNameRegion(lastSrc, { x, y, w, h });
  });
})();
// กันการอ่านซ้อนกัน
const _runOCR = runOCR;
runOCR = async function (c) { busy = true; try { await _runOCR(c); } finally { busy = false; } };

/* ---------------- OCR ---------------- */
async function runOCR(srcCanvas) {
  statusDiv.style.color = '#e74c3c';
  statusDiv.innerText = 'กำลังปรับภาพ...';
  inputName.placeholder = inputAddress.placeholder = 'กำลังประมวลผล...';
  try {
    await new Promise(r => setTimeout(r, 30)); // ให้ UI วาดข้อความก่อน
    const { data } = await ocrBest(srcCanvas);

    $('raw').textContent = data.text;
    const lines = (data.lines && data.lines.length)
      ? data.lines.map(l => (l.words && l.words.length) ? { text: joinWords(l.words), conf: l.confidence, spaced: true } : { text: l.text, conf: l.confidence })
      : data.text.split('\n').map(t => ({ text: t, conf: 100 }));
    parseLabel(lines, data.text);
    statusDiv.innerText = 'อ่านข้อมูลสำเร็จ กรุณาตรวจสอบและแก้ไขหากจำเป็น' + (lastWarn ? '\n' + lastWarn : '');
  } catch (e) {
    statusDiv.innerText = 'เกิดข้อผิดพลาดในการอ่านภาพ: ' + (e.message || e);
  }
}

/* ---------------- ทำความสะอาดข้อความไทย ---------------- */
const THAI_DIGITS = '๐๑๒๓๔๕๖๗๘๙';
const ADDR_MARKERS = /(\S)(เลขที่|หมู่ที่|หมู่|ซอย|ถนน|ตำบล|อำเภอ|จังหวัด|แขวง|เขต|ต\.|อ\.|จ\.|ถ\.)/g;

function cleanThai(s, keepSpaces) {
  if (keepSpaces) return cleanThaiKeep(s).replace(ADDR_MARKERS, '$1 $2');
  s = s.replace(/[|¦\\_~`^*“”"]/g, ' ')
       .replace(/[๐-๙]/g, d => THAI_DIGITS.indexOf(d))
       .replace(/\u0E4D\u0E32/g, '\u0E33')              // นฤคหิต + า → ำ
       .replace(/([\u0E48-\u0E4B])\1+/g, '$1')           // วรรณยุกต์ซ้ำ
       .replace(/([\u0E31\u0E34-\u0E3A\u0E47-\u0E4E])\1+/g, '$1'); // สระ/เครื่องหมายบนล่างซ้ำ
  // Tesseract ไทยมักแทรกช่องว่างระหว่างตัวอักษร → ตัดช่องว่างระหว่างอักษรไทยออก
  s = s.replace(new RegExp(`([${TH}])[ \\t]+(?=[${TH}])`, 'g'), '$1');
  // ใส่ช่องว่างกลับก่อนคำบอกส่วนของที่อยู่
  s = s.replace(ADDR_MARKERS, '$1 $2');
  return s.replace(/[ \t]{2,}/g, ' ').trim();
}

/* ---------------- แก้ชื่อจังหวัดด้วย fuzzy match ---------------- */
const PROVINCES = "กระบี่ กรุงเทพมหานคร กาญจนบุรี กาฬสินธุ์ กำแพงเพชร ขอนแก่น จันทบุรี ฉะเชิงเทรา ชลบุรี ชัยนาท ชัยภูมิ ชุมพร เชียงราย เชียงใหม่ ตรัง ตราด ตาก นครนายก นครปฐม นครพนม นครราชสีมา นครศรีธรรมราช นครสวรรค์ นนทบุรี นราธิวาส น่าน บึงกาฬ บุรีรัมย์ ปทุมธานี ประจวบคีรีขันธ์ ปราจีนบุรี ปัตตานี พระนครศรีอยุธยา พะเยา พังงา พัทลุง พิจิตร พิษณุโลก เพชรบุรี เพชรบูรณ์ แพร่ ภูเก็ต มหาสารคาม มุกดาหาร แม่ฮ่องสอน ยโสธร ยะลา ร้อยเอ็ด ระนอง ระยอง ราชบุรี ลพบุรี ลำปาง ลำพูน เลย ศรีสะเกษ สกลนคร สงขลา สตูล สมุทรปราการ สมุทรสงคราม สมุทรสาคร สระแก้ว สระบุรี สิงห์บุรี สุโขทัย สุพรรณบุรี สุราษฎร์ธานี สุรินทร์ หนองคาย หนองบัวลำภู อ่างทอง อำนาจเจริญ อุดรธานี อุตรดิตถ์ อุทัยธานี อุบลราชธานี".split(' ');

function lev(a, b) {
  const m = a.length, n = b.length, p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    let prev = p[0]; p[0] = i;
    for (let j = 1; j <= n; j++) {
      const t = p[j];
      p[j] = Math.min(p[j] + 1, p[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = t;
    }
  }
  return p[n];
}
function nearestProvince(tok) {
  if (tok.length < 3) return tok;
  if (/^กรุงเทพ/.test(tok)) return 'กรุงเทพมหานคร';
  let best = tok, bd = 99;
  for (const p of PROVINCES) { const d = lev(tok, p); if (d < bd) { bd = d; best = p; } }
  return bd <= Math.max(1, Math.floor(tok.length * 0.25)) ? best : tok;
}
function fixProvince(addr) {
  const re1 = new RegExp(`(จ\\.|จังหวัด)\\s*([${TH}]+)`);
  if (re1.test(addr)) return addr.replace(re1, (_, k, t) => `${k}${k === 'จ.' ? '' : ' '}${nearestProvince(t)}`);
  // ไม่มีคำว่า จ. → ใช้คำก่อนรหัสไปรษณีย์ท้ายที่อยู่
  return addr.replace(new RegExp(`([${TH}]+)\\s*(\\d{5})\\s*$`), (_, t, z) => `${nearestProvince(t)} ${z}`);
}

/* ---------------- แยกข้อมูลจากสติ๊กเกอร์ ---------------- */
function extractPhone(line) {
  // แก้ O→0 และ I/l→1 เฉพาะเพื่อหาเบอร์
  const t = line.replace(/[Oo]/g, '0').replace(/(?<=\d)[Il|](?=\d)/g, '1');
  const m = t.match(/0\d(?:[\s.\-]?\d){7,8}/);        // 9–10 หลัก ขึ้นต้น 0
  if (!m) return null;
  const digits = m[0].replace(/\D/g, '');
  if (digits.length < 9 || digits.length > 10) return null;
  const fmt = digits.length === 10
    ? `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`
    : `${digits.slice(0, 2)}-${digits.slice(2, 5)}-${digits.slice(5)}`;
  return { phone: fmt, rest: t.replace(m[0], ' ') };
}

function parseLabel(rawLines, fullText) {
  // 1) กรองบรรทัดขยะ: ความมั่นใจต่ำมาก หรือแทบไม่มีตัวอักษร/ตัวเลข
  let lines = rawLines
    .filter(l => l.conf >= 25)
    .map(l => cleanThai(l.text, l.spaced))
    .filter(t => {
      if (t.length < 2) return false;
      const good = (t.match(new RegExp(`[${TH}A-Za-z0-9]`, 'g')) || []).length;
      return good / t.length >= 0.5;
    });

  // 2) ถ้ามีหัวข้อ "ผู้รับ" ให้ใช้เฉพาะช่วงผู้รับ (ตัดส่วนผู้ส่งทิ้ง)
  const iTo = lines.findIndex(l => /ผู้รับ|ส่งถึง|^(to|ship to)\b/i.test(l));
  if (iTo >= 0) {
    let iEnd = lines.findIndex((l, i) => i > iTo && /ผู้ส่ง|^(from|sender)\b/i.test(l));
    if (iEnd < 0) iEnd = lines.length;
    lines = lines.slice(iTo, iEnd).map((l, i) => i === 0 ? l.replace(/^.*?(ผู้รับ(สินค้า)?|ส่งถึง|to|ship to)\s*[:：]?\s*/i, '') : l)
                 .filter(l => l);
  }

  let phone = '', name = '', company = '';
  const addr = [];
  const prefix = /(คุณ|นาย|นางสาว|นาง|น\.ส\.|ด\.ช\.|ด\.ญ\.|Mr\.?|Mrs\.?|Ms\.?)/;

  for (const line of lines) {
    const p = extractPhone(line);
    let rest = line;
    if (p && !phone) { phone = p.phone; rest = p.rest; }
    rest = rest.replace(/(โทรศัพท์|โทร|เบอร์โทร|เบอร์|Tel|Phone)\s*[.:：]?/gi, ' ').replace(/\s{2,}/g, ' ').trim();
    if (rest.length < 2) continue;

    if (!name && /^(ชื่อ)\s*[:：]?/.test(rest)) { name = rest.replace(/^ชื่อ\s*[:：]?\s*/, ''); continue; }
    if (!company && COMPANY_RE.test(rest)) { company = rest; continue; }
    if (!name && prefix.test(rest) && !/\d{3,}/.test(rest)) { name = rest; continue; }
    addr.push(rest);
  }
  if (!name && !company && addr.length) name = addr.shift();

  let address = addr.join(' ').replace(/\s{2,}/g, ' ').trim();
  address = fixProvince(address);

  inputName.value = [cleanName(name), cleanName(company)].filter(Boolean).join(' / ');
  inputAddress.value = address || cleanThai(fullText);
  inputOthers.value = phone;
}

/* ---------------- บันทึกลง Google Sheets ---------------- */
$('save-btn').addEventListener('click', async () => {
  const payload = { name: inputName.value, address: inputAddress.value, others: inputOthers.value };
  statusDiv.style.color = '#e74c3c';
  statusDiv.innerText = 'กำลังบันทึกข้อมูลลง Google Sheet...';
  $('save-btn').disabled = true;
  try {
    await fetch(WEB_APP_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    statusDiv.style.color = '#27ae60';
    statusDiv.innerText = 'บันทึกข้อมูลเรียบร้อยแล้ว!';
    setTimeout(() => {
      $('retake-btn').click();
      statusDiv.style.color = '#e74c3c';
      $('save-btn').disabled = false;
    }, 2000);
  } catch (e) {
    statusDiv.innerText = 'เกิดข้อผิดพลาดในการบันทึก: ' + e;
    $('save-btn').disabled = false;
  }
});
</script>
